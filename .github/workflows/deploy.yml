# Push 到 GitHub 后自动部署到 Cloudflare Workers
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   CLOUDFLARE_API_TOKEN   — Cloudflare API Token（权限：Account / Workers Scripts / D1 / Edit）
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 账户 ID
# 另外 wrangler.toml 里的 D1 database_id 需提前填好（见 README）

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 自动创建/复用 D1、写入 database_id、应用迁移、部署（一步到位）
      - name: Deploy
        run: npm run deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
