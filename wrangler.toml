name = "hakimi"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# 前端构建产物（web/ 是 React + shadcn/ui 项目，先 npm run build）
[assets]
directory = "./web/dist"

# D1 数据库：先执行 `wrangler d1 create hakimi`，把返回的 database_id 填到这里
[[d1_databases]]
binding = "DB"
database_name = "hakimi"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
